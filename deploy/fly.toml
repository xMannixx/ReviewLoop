app = "reviewloop"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  REVIEWLOOP_HOST = "0.0.0.0"
  REVIEWLOOP_PORT = "5000"

[[services]]
  internal_port = 5000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
