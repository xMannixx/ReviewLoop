services:
  dashboard:
    build: .
    ports:
      - "5000:5000"
    environment:
      REVIEWLOOP_HOST: "0.0.0.0"
      REVIEWLOOP_PORT: "5000"
      # Add provider keys here or use your shell environment:
      # ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      # OPENAI_API_KEY: "${OPENAI_API_KEY}"
    volumes:
      - ./data:/app/data
      # Optional local override:
      # - ./config.toml:/app/config.toml:ro
