<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="ReviewLoop preview">
  <rect width="1200" height="620" rx="28" fill="#0f1117"/>
  <rect x="40" y="36" width="1120" height="64" rx="16" fill="#1a1d27" stroke="#2a2d3a"/>
  <circle cx="78" cy="68" r="16" fill="#1e6fb5"/>
  <text x="108" y="74" fill="#e0e0e0" font-family="Segoe UI, Arial" font-size="22" font-weight="700">ReviewLoop</text>
  <rect x="940" y="54" width="70" height="30" rx="8" fill="#0f1117" stroke="#2a2d3a"/>
  <text x="961" y="74" fill="#9ca3af" font-family="Segoe UI, Arial" font-size="13" font-weight="700">EN</text>
  <rect x="1024" y="54" width="104" height="30" rx="8" fill="#0f1117" stroke="#2a2d3a"/>
  <text x="1046" y="74" fill="#9ca3af" font-family="Segoe UI, Arial" font-size="13" font-weight="700">API Keys</text>

  <text x="70" y="160" fill="#ffffff" font-family="Segoe UI, Arial" font-size="32" font-weight="800">Pipeline Runs</text>
  <text x="70" y="188" fill="#9ca3af" font-family="Segoe UI, Arial" font-size="16">Every run moves through 5 review phases. You approve each handoff.</text>
  <rect x="960" y="136" width="154" height="44" rx="12" fill="#1e6fb5"/>
  <text x="994" y="164" fill="#ffffff" font-family="Segoe UI, Arial" font-size="16" font-weight="700">+ New Run</text>

  <g transform="translate(70 230)">
    <rect width="320" height="190" rx="18" fill="#1a1d27" stroke="#1e6fb5"/>
    <text x="22" y="38" fill="#e0e0e0" font-family="Segoe UI, Arial" font-size="18" font-weight="700">Auth module review</text>
    <rect x="202" y="22" width="94" height="24" rx="12" fill="#1a2744" stroke="#1e6fb5"/>
    <text x="218" y="39" fill="#64b5f6" font-family="Segoe UI, Arial" font-size="11" font-weight="700">RUNNING</text>
    <text x="22" y="78" fill="#6b7280" font-family="Segoe UI, Arial" font-size="13">Phase 2/5 � Parallel review</text>
    <rect x="22" y="116" width="276" height="8" rx="4" fill="#2a2d3a"/>
    <rect x="22" y="116" width="110" height="8" rx="4" fill="#1e6fb5"/>
    <text x="22" y="154" fill="#9ca3af" font-family="Segoe UI, Arial" font-size="13">Demo mode ready � no API key required</text>
  </g>

  <g transform="translate(440 230)">
    <rect width="320" height="190" rx="18" fill="#1a1d27" stroke="#6b33b5"/>
    <text x="22" y="38" fill="#e0e0e0" font-family="Segoe UI, Arial" font-size="18" font-weight="700">Billing edge cases</text>
    <rect x="176" y="22" width="120" height="24" rx="12" fill="#1e1032" stroke="#6b33b5"/>
    <text x="194" y="39" fill="#c084fc" font-family="Segoe UI, Arial" font-size="11" font-weight="700">AWAITING</text>
    <text x="22" y="78" fill="#6b7280" font-family="Segoe UI, Arial" font-size="13">Phase 3/5 � Consolidation</text>
    <rect x="22" y="116" width="276" height="8" rx="4" fill="#2a2d3a"/>
    <rect x="22" y="116" width="165" height="8" rx="4" fill="#6b33b5"/>
    <text x="22" y="154" fill="#9ca3af" font-family="Segoe UI, Arial" font-size="13">Approve, edit, reject, or retry</text>
  </g>

  <g transform="translate(810 230)">
    <rect width="320" height="190" rx="18" fill="#1a1d27" stroke="#1e6b3a"/>
    <text x="22" y="38" fill="#e0e0e0" font-family="Segoe UI, Arial" font-size="18" font-weight="700">Public release prep</text>
    <rect x="178" y="22" width="118" height="24" rx="12" fill="#0f2a1a" stroke="#1e6b3a"/>
    <text x="196" y="39" fill="#4ade80" font-family="Segoe UI, Arial" font-size="11" font-weight="700">COMPLETE</text>
    <text x="22" y="78" fill="#6b7280" font-family="Segoe UI, Arial" font-size="13">Phase 5/5 � Build handoff</text>
    <rect x="22" y="116" width="276" height="8" rx="4" fill="#2a2d3a"/>
    <rect x="22" y="116" width="276" height="8" rx="4" fill="#1e6b3a"/>
    <text x="22" y="154" fill="#9ca3af" font-family="Segoe UI, Arial" font-size="13">Cursor task YAML generated</text>
