  <rect x="70" y="470" width="1060" height="82" rx="18" fill="#1a1d27" stroke="#2a2d3a"/>
  <text x="100" y="506" fill="#e0e0e0" font-family="Segoe UI, Arial" font-size="18" font-weight="700">Five-phase AI review workflow</text>
  <text x="100" y="532" fill="#9ca3af" font-family="Segoe UI, Arial" font-size="15">Brief � Parallel Review � Consolidation � Cursor Task � Build Handoff</text>
</svg>
